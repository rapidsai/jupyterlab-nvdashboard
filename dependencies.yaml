# Dependency list for https://github.com/rapidsai/dependency-file-generator
files:
  all:
    output: conda
    matrix:
      arch: ['any']
    includes:
      - build_wheels
      - checks
      - cuda_version
      - py_version
      - run
      - test_python
  test_frontend:
    output: none
    includes:
      - test_frontend
  test_python:
    output: none
    includes:
      - py_version
      - test_python
  checks:
    output: none
    includes:
      - checks
      - py_version
  py_build:
    output: pyproject
    pyproject_dir: ./
    extras:
      table: build-system
    includes:
      - build_wheels
  py_run:
    output: pyproject
    pyproject_dir: ./
    extras:
      table: project
    includes:
      - run
  py_test:
    output: pyproject
    pyproject_dir: ./
    extras:
      table: project.optional-dependencies
      key: test
    includes:
      - test_python
      - cuda_version
channels:
  - rapidsai
  - rapidsai-nightly
  - conda-forge
dependencies:
  build_wheels:
    common:
      - output_types: pyproject
        packages:
          - hatch-jupyter-builder>=0.10.0
          - hatch-nodejs-version>=0.3.2
          - hatchling>=1.27.0
          - jupyter-builder>=1.0
  checks:
    common:
      - output_types: [conda]
        packages:
          # 'identify' floor ensures pre-commit hooks that support 'jupyter' files can run
          #
          # ref: https://github.com/pre-commit/pre-commit/issues/3698
          - identify>=1.4.20
          - pre-commit
          - nodejs=22
  # 'cuda_version' intentionally does not contain fallback entries... we want
  # a loud error if an unsupported 'cuda' value is passed
  cuda_version:
    specific:
      - output_types: conda
        matrices:
          - matrix:
              cuda: "12.2"
            packages:
              - cuda-version=12.2
          - matrix:
              cuda: "12.9"
            packages:
              - cuda-version=12.9
          - matrix:
              cuda: "13.0"
            packages:
              - cuda-version=13.0
          - matrix:
              cuda: "13.4"
            packages:
              - &latest_cuda cuda-version=13.4
          - matrix:
            packages:
              - *latest_cuda
      - output_types: [requirements, constraints]
        matrices:
          - matrix:
              use_cuda_wheels: "false"
            packages:
          - matrix:
              cuda: "12.2"
              use_cuda_wheels: "true"
            packages:
              - cuda-toolkit==12.2.*
          - matrix:
              cuda: "12.9"
              use_cuda_wheels: "true"
            packages:
              - cuda-toolkit==12.9.*
          - matrix:
              cuda: "13.0"
              use_cuda_wheels: "true"
            packages:
              - cuda-toolkit==13.0.*
          - matrix:
              cuda: "13.*"
              use_cuda_wheels: "true"
            packages:
              - &latest_ctk cuda-toolkit==13.4.*
          - matrix:
            packages:
              - *latest_ctk
  py_version:
    specific:
      - output_types: [conda]
        matrices:
          - matrix:
              py: "3.12"
            packages:
              - python=3.12
          - matrix:
              py: "3.13"
            packages:
              - python=3.13
          - matrix:
              py: "3.14"
            packages:
              - python=3.14
          - matrix:
              py: "3.15"
            packages:
              - python=3.15
          - matrix:
            packages:
              - python>=3.12
  run:
    common:
      - output_types: [conda]
        packages:
          - &nodejs nodejs=22
      - output_types: [conda, requirements, pyproject]
        packages:
          - &jupyterlab jupyterlab>=4.0.0
          - psutil
          - cuda-bindings>=12.9.6,!=13.0.*,!=13.1.*,!=13.2.*,<14
          - cuda-core>=1.0.0
          - tornado
  test_frontend:
    common:
      - output_types: [conda]
        packages:
          - *jupyterlab
          - *nodejs
  test_python:
    common:
      - output_types: [conda, requirements, pyproject]
        packages:
          - pytest
      - output_types: [requirements, pyproject]
        packages:
          - pytest-jupyter[server]>=0.6.0
      - output_types: [conda]
        packages:
          - pytest-jupyter-server>=0.6.0
